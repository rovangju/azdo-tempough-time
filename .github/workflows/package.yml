name: Package extension

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    name: Package ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: make setup
      - name: Package VSIX
        id: package
        run: make package VERSION="${{ github.ref_name }}"
      - name: Attach VSIX to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.package.outputs.tag }}
          ARTIFACT_PATH: ${{ steps.package.outputs.artifact_path }}
          PRERELEASE: ${{ steps.package.outputs.prerelease }}
        run: scripts/publish-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: tempough-time-${{ steps.package.outputs.tag }}
          path: ${{ steps.package.outputs.artifact_path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
