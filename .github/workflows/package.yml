name: Release extension

on:
  workflow_dispatch:
    inputs:
      version:
        description: Final release version (vMAJOR.MINOR.PATCH.9999)
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    name: Package ${{ inputs.version }}
    runs-on: ubuntu-latest
    outputs:
      artifact_path: ${{ steps.package.outputs.artifact_path }}
      source_commit: ${{ steps.source.outputs.commit }}
      tag: ${{ steps.package.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: make setup
      - name: Validate final release version
        run: node scripts/validate-final-release.mjs "${{ inputs.version }}"
      - name: Package VSIX
        id: package
        run: make package VERSION="${{ inputs.version }}"
      - name: Record release commit
        id: source
        run: printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: tempough-time-${{ steps.package.outputs.tag }}
          path: ${{ steps.package.outputs.artifact_path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: Create draft release
    needs: package
    runs-on: ubuntu-latest
    environment: production-release
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.package.outputs.source_commit }}
      - uses: actions/download-artifact@v4
        with:
          name: tempough-time-${{ needs.package.outputs.tag }}
          path: artifacts
      - name: Create tag and attach VSIX to draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_PATH: artifacts/tempough-time.vsix
          PRERELEASE: false
          TAG: ${{ needs.package.outputs.tag }}
          TARGET_COMMIT: ${{ needs.package.outputs.source_commit }}
        run: scripts/publish-release.sh
